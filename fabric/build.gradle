plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    apiModule { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common, apiModule
    runtimeClasspath.extendsFrom common, apiModule
    developmentFabric.extendsFrom common, apiModule
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

repositories {
    gradlePluginPortal()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.nucleoid.xyz/"; name "Nucleoid" }
    mavenCentral()
}

def tgt     = rootProject.ext.mcTarget
def mcCoord = tgt.mc

// The placeholder-api library did a major API redesign between the 1.21.11-era release
// (Placeholders.register) and the 26.x-era release (Placeholders.registerServer); the 26.x
// entrypoint lives in the `unobfuscated` fork.
sourceSets {
    main {
        java {
            srcDir "src/unobfuscated/java"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcCoord}"

    // Platform loader + API
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.findProperty('fabric_api_version') ?: tgt.fabricApi}"
    api "dev.architectury:architectury-fabric:${rootProject.findProperty('architectury_version_plain') ?: tgt.architecturyVer}"

    // Link common module
    common(project(path: ":common")) { transitive = false }
    apiModule(project(path: ":api")) { transitive = false }
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    shadowBundle 'org.xerial:sqlite-jdbc:3.49.1.0'
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")
    shadowBundle project(path: ":api", configuration: "transformProductionFabric")

    compileOnly "eu.pb4:placeholder-api:${rootProject.findProperty('text_placeholder_api_version') ?: tgt.textPlaceholderApi}"
}

processResources {
    def (mcLo, mcHi) = rootProject.ext.mcRange(tgt)
    def mcPredicate = ">=${mcLo} <${mcHi}"

    inputs.property("version", project.version)
    inputs.property("mcLo", mcLo)
    inputs.property("mcHi", mcHi)
    inputs.property("mcPredicate", mcPredicate)
    inputs.property("archVer", tgt.architecturyVer)

    filesMatching("fabric.mod.json") {
        expand version: project.version, mcLo: mcLo, mcHi: mcHi,
                mcPredicate: mcPredicate, archVer: tgt.architecturyVer
    }
}

// 26.3 is unobfuscated: the plain jar is the raw classifier and shadowJar builds the shipped jar.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
}
