plugins {
    id "dev.architectury.loom"
}

def mcCoord = (rootProject.findProperty("minecraft_version") ?: rootProject.minecraft_version) as String
def tgt     = rootProject.ext.resolveMcTarget(mcCoord)

def platforms = (rootProject.findProperty("filter_platforms") ?: "fabric,neoforge")
        .split(",")
        .collect { it.trim() }

architectury {
    common(platforms)
}

// `modern` and `unobfuscated` hold the Minecraft-26.3 compat forks. A handful of vanilla classes
// were renamed across the versions this mod used to target (e.g. ClickType -> ContainerInput).
// Everything else lives in src/main/java; only files that reference a renamed class live here.
sourceSets {
    // These integration tests bootstrap the 26.3 item component registries.
    if (mcCoord == '26.3') {
        test.java.srcDir 'src/test26_3/java'
    }
    main {
        java {
            srcDir "src/unobfuscated/java"
            srcDir "src/modern/java"
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    // Required Minecraft jar for Loom
    minecraft "com.mojang:minecraft:${mcCoord}"
    implementation project(":api")
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    if (tgt.obfuscated) {
        // Obfuscated targets compile against Mojang's official mappings and are remapped per-platform
        // at build time (see the Fabric and NeoForge transformProduction* tasks).
        mappings loom.officialMojangMappings()

        // Fabric loader only for @Environment annotations
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    } else {
        // Fabric loader only for @Environment annotations
        implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
