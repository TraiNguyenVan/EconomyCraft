plugins {
    id "dev.architectury.loom"
}

def tgt     = rootProject.ext.mcTarget
def mcCoord = tgt.mc

def platforms = (rootProject.findProperty("filter_platforms") ?: "fabric,neoforge")
        .split(",")
        .collect { it.trim() }

architectury {
    common(platforms)
}

// Minecraft classes renamed between the last obfuscated version (1.21.11, e.g. ClickType) and the
// unobfuscated 26.x line (e.g. ContainerInput) live in the `unobfuscated` fork; `modern` is the
// current-era fork. Minecraft 26.3 is the only supported target, so those are the only variants.
// The 26.3 integration tests bootstrap the item component registries and live in their own source
// set.
sourceSets {
    test {
        java.srcDir 'src/test26_3/java'
    }
    main {
        java {
            srcDir "src/unobfuscated/java"
            srcDir "src/modern/java"
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation 'org.mockito:mockito-core:5.18.0'
    // Required Minecraft jar for Loom
    minecraft "com.mojang:minecraft:${mcCoord}"
    implementation project(":api")
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // Fabric loader only for @Environment annotations
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Architectury API — resolved from the shared target so common and the platform modules pull
    // the same version.
    implementation "dev.architectury:architectury:${rootProject.findProperty('architectury_version_plain') ?: tgt.architecturyVer}"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
