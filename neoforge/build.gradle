plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common { canBeResolved = true; canBeConsumed = false }
    apiModule { canBeResolved = true; canBeConsumed = false }
    compileClasspath.extendsFrom common, apiModule
    runtimeClasspath.extendsFrom common, apiModule
    developmentNeoForge.extendsFrom common, apiModule
    shadowBundle { canBeResolved = true; canBeConsumed = false }
}

repositories {
    gradlePluginPortal()
    maven { url "https://maven.neoforged.net/releases" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://maven.offsetmonkey538.top/releases"; name "OffsetMonkey538" }
    mavenCentral()
}

def tgt     = rootProject.ext.mcTarget
def mcCoord = tgt.mc

// The placeholder-api-neoforge library did a major API redesign between the 1.21.11-era release
// (Placeholders.register) and the 26.x-era release (Placeholders.registerServer), so the 26.x
// entrypoint lives in the `unobfuscated` fork and the 26.x mod class in `modern`. The TAB bridge
// doesn't touch placeholder-api-neoforge at all, so it lives in src/main/java and is shared.
sourceSets {
    main {
        java {
            srcDir "src/modern/java"
            srcDir "src/unobfuscated/java"
        }
    }
}

dependencies {
    // Required for Loom
    minecraft "com.mojang:minecraft:${mcCoord}"

    // Platform loader + API
    neoForge "net.neoforged:neoforge:${rootProject.findProperty('neoforge_version') ?: tgt.neoforge}"
    api "dev.architectury:architectury-neoforge:${rootProject.findProperty('architectury_version_plain') ?: tgt.architecturyVer}"

    // Link common module
    common(project(path: ":common")) { transitive = false }
    apiModule(project(path: ":api")) { transitive = false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
    shadowBundle project(path: ":api", configuration: "transformProductionNeoForge")

    def placeholderNeoForgeVersion = rootProject.findProperty('placeholder_api_neoforge_version')
            ?: tgt.placeholderApiNeoForge
    if (placeholderNeoForgeVersion) {
        compileOnly "eu.pb4:placeholder-api-neoforge:${placeholderNeoForgeVersion}"
    }

    // Deliberately no TAB dependency: TAB's API isn't published anywhere this build can reliably
    // resolve (no publish step in its own CI, and its multi-module JitPack coordinates don't
    // resolve), so EconomyCraftNeoForgeTab talks to it via reflection instead.
}

processResources {
    def (mcLo, mcHi) = rootProject.ext.mcRange(tgt)

    def nfLo = (rootProject.findProperty("neoforge_line_lo") ?: tgt.neoforgeLineLo).toString()
    def nfHi = (rootProject.findProperty("neoforge_line_hi") ?: tgt.neoforgeLineHi).toString()

    def archVer = (rootProject.findProperty("architectury_version_plain")
            ?: project.findProperty("architectury_version_plain")
            ?: tgt.architecturyVer).toString()
    def placeholderModId = rootProject.ext.placeholderModId

    inputs.property "version", project.version
    inputs.property "mcLo", mcLo
    inputs.property "mcHi", mcHi
    inputs.property "nfLo", nfLo
    inputs.property "nfHi", nfHi
    inputs.property "archVer", archVer
    inputs.property "placeholderModId", placeholderModId

    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                version : project.version,
                mcLo    : mcLo,
                mcHi    : mcHi,
                nfLo    : nfLo,
                nfHi    : nfHi,
                archVer : archVer,
                placeholderModId: placeholderModId
        ])
        filteringCharset = 'UTF-8'
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}

// 26.3 is unobfuscated: the plain jar is the raw classifier and shadowJar builds the shipped jar.
jar {
    archiveClassifier = "raw"
}

shadowJar {
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null

    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': project.version
        )
    }
}
