modLoader = "javafml"
loaderVersion = "[1,)"
license = "GPL-3.0"

[[mods]]
modId = "economycraft"
version = "${version}"
displayName = "EconomyCraft"
authors = "ReaZip"
logoFile = "assets/economycraft/logo.png"
description = '''
Server-side economy mod.
'''

# ---- Minecraft:
[[dependencies.economycraft]]
modId = "minecraft"
type = "required"
versionRange = "[${mcLo},${mcHi})"
ordering = "NONE"
side = "BOTH"

# ---- NeoForge:
[[dependencies.economycraft]]
modId = "neoforge"
type = "required"
versionRange = "[${nfLo},${nfHi})"
ordering = "NONE"
side = "BOTH"

# ---- Architectury:
[[dependencies.economycraft]]
modId = "architectury"
type = "required"
versionRange = "[${archVer},)"
ordering = "NONE"
side = "BOTH"

# ---- Mixins (server-side display hooks; see TODO.md P3-T1):
[[mixins]]
config = "economycraft.mixins.json"

# ---- Placeholder API NeoForge (optional, for mod-to-mod placeholder integration):
[[dependencies.economycraft]]
modId = "${placeholderModId}"
type = "optional"
versionRange = "[1,)"
ordering = "AFTER"
side = "BOTH"
