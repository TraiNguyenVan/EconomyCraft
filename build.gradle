import org.gradle.api.GradleException

plugins {
    id "dev.architectury.loom-no-remap" version "1.17.493" apply false
    id "dev.architectury.loom" version "1.17.493" apply false
    id "architectury-plugin" version "3.5.170"
    id "com.gradleup.shadow" version "9.3.1" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

// ---- Build target ----
// Minecraft 26.3 is the only supported target, for both Fabric and NeoForge. The 26.x line is
// unobfuscated, so the build never remaps against Mojang mappings and there are no per-version
// task names. Must stay defined before subprojects{} — its configuration closure isn't guaranteed
// to run after the rest of this script, so it can't safely forward-reference an ext value defined
// later in the file.
ext.mcTarget = [
        mc: "26.3",
        fabricApi: "0.160.5+26.3",
        architecturyVer: "22.0.1",
        neoforge: "26.3.0.3-beta",
        neoforgeLineLo: "26.3",
        neoforgeLineHi: "26.4",
        textPlaceholderApi: "3.2.0+26.3",
        placeholderApiNeoForge: "3.1.0-beta.1+26.2+neoforge",
        javaVersion: 25,
]

ext.mcRange = { tgt ->
    def parts = tgt.mc.tokenize('.')
    if (parts.size() < 2) throw new GradleException("Invalid minecraft_version: ${tgt.mc}")
    def major = parts[0] as int
    def minor = parts[1] as int
    return ["${major}.${minor}".toString(), "${major}.${minor + 1}".toString()]
}

ext.placeholderModId = "placeholder-api-neoforge"

subprojects {
    def mcCoord = rootProject.ext.mcTarget.mc as String
    def tgt = rootProject.ext.mcTarget

    // Minecraft 26.3 is unobfuscated, so Loom's no-remap plugin is used throughout.
    apply plugin: "dev.architectury.loom-no-remap"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = "${rootProject.archives_name}-${project.name}-${rootProject.mod_version}_${mcCoord}"
    }

    tasks.withType(Jar).configureEach { archiveVersion = "" }

    repositories {
        gradlePluginPortal()
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases" }
        mavenCentral()
    }

    def javaVer = tgt.javaVersion as int
    java {
        sourceCompatibility = JavaVersion.toVersion(javaVer)
        targetCompatibility = JavaVersion.toVersion(javaVer)
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVer)
        }
    }
    tasks.withType(JavaCompile).configureEach { options.release = javaVer }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
        // Intentionally empty: release jars are published to Modrinth/CurseForge in CI, not a Maven repo.
        repositories {}
    }

    if (project.name == "neoforge") {
        tasks.named("processResources") {
            def (mcLo, mcHi) = rootProject.ext.mcRange(tgt)

            def nfLo = (rootProject.findProperty("neoforge_line_lo") ?: tgt.neoforgeLineLo).toString()
            def nfHi = (rootProject.findProperty("neoforge_line_hi") ?: tgt.neoforgeLineHi).toString()

            def archVer = (rootProject.findProperty("architectury_version_plain")
                    ?: project.findProperty("architectury_version_plain")
                    ?: tgt.architecturyVer).toString()
            def placeholderModId = rootProject.ext.placeholderModId

            inputs.property "mcLo", mcLo
            inputs.property "mcHi", mcHi
            inputs.property "nfLo", nfLo
            inputs.property "nfHi", nfHi
            inputs.property "archVer", archVer
            inputs.property "placeholderModId", placeholderModId

            filesMatching("META-INF/neoforge.mods.toml") {
                expand([
                        mcLo    : mcLo,
                        mcHi    : mcHi,
                        nfLo    : nfLo,
                        nfHi    : nfHi,
                        archVer : archVer,
                        placeholderModId: placeholderModId,
                        version : project.version
                ])
                filteringCharset = 'UTF-8'
            }
        }
    }
}

// ---- Build, deploy and run ----
// The root `build` task builds every configured platform. These tasks add the release/deploy
// convenience of copying the built jar into build/<platform>/<mc> and, when present, the local
// dev server's mods folder.
import org.gradle.internal.os.OperatingSystem

// Each platform's server jar is compiled for the target's Java version. Launch the local dev
// servers with the provisioned toolchain JDK rather than a bare `java`, whose version depends
// on the (Gradle daemon's) PATH and may not match.
apply plugin: "jvm-toolchains"

def serverJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(rootProject.ext.mcTarget.javaVersion as int)
}
def mcVersion = rootProject.ext.mcTarget.mc

// Tasks are registered only for the platforms enabled by -Pfilter_platforms (default: both), so a
// single-platform invocation never references an absent subproject.
if (findProject(":fabric") != null) {
    tasks.register("buildAndCopyFabricJars") {
        group = "build/fabric"
        description = "Build the Fabric jar for MC ${mcVersion} and copy it to build/fabric and local_servers"
        dependsOn ":fabric:build"
        doLast {
            def libsDir = file("${rootProject.projectDir}/fabric/build/libs")
            if (!libsDir.exists()) {
                throw new GradleException("Libs dir not found: ${libsDir}")
            }

            def builtJars = libsDir.listFiles().findAll { File f ->
                f.name.endsWith(".jar") &&
                        !f.name.endsWith("-sources.jar") &&
                        !f.name.contains("-raw") &&
                        !f.name.contains("dev-shadow")
            }
            if (builtJars.isEmpty()) {
                throw new GradleException("No built jars found in ${libsDir}")
            }

            def buildOut = file("${rootProject.projectDir}/build/fabric/${mcVersion}")
            copy {
                from builtJars
                into buildOut
            }

            def localModsDir = file("${rootProject.projectDir}/local_servers/fabric/${mcVersion}/mods")
            if (!localModsDir.exists()) {
                println "local_servers/fabric/${mcVersion}/mods not found – skipped local deploy."
                return
            }

            localModsDir.listFiles()?.findAll { File f ->
                f.name.endsWith(".jar") &&
                        f.name.toLowerCase().contains(rootProject.archives_name.toString().toLowerCase())
            }?.each { it.delete() }

            copy {
                from builtJars
                into localModsDir
            }

            println "Deployed Fabric ${mcVersion} jar to ${buildOut} and ${localModsDir}"
        }
    }

    tasks.register("runLocalFabric", Exec) {
        group = "run/fabric"
        description = "Build, deploy and run local Fabric server for MC ${mcVersion}"
        dependsOn "buildAndCopyFabricJars"

        workingDir "$rootProject.projectDir/local_servers/fabric/${mcVersion}"
        args "-Xmx4G", "-jar", "fabric-server-launch.jar", "nogui"
        doFirst {
            executable serverJavaLauncher.get().executablePath.asFile.absolutePath
        }
    }
}

if (findProject(":neoforge") != null) {
    tasks.register("buildAndCopyNeoForgeJars") {
        group = "build/neoforge"
        description = "Build the NeoForge jar for MC ${mcVersion} and copy it to build/neoforge and local_servers"
        dependsOn ":neoforge:build"
        doLast {
            def nfLibsDir = file("${rootProject.projectDir}/neoforge/build/libs")
            if (!nfLibsDir.exists()) {
                throw new GradleException("NeoForge libs dir not found: ${nfLibsDir}")
            }

            def nfJars = nfLibsDir.listFiles().findAll { File f ->
                f.name.endsWith(".jar") &&
                        !f.name.endsWith("-sources.jar") &&
                        !f.name.contains("-raw") &&
                        !f.name.contains("dev-shadow")
            }
            if (nfJars.isEmpty()) {
                throw new GradleException("No NeoForge jars found in ${nfLibsDir}")
            }

            def nfOut = file("${rootProject.projectDir}/build/neoforge/${mcVersion}")
            copy {
                from nfJars
                into nfOut
            }

            def localModsDir = file("${rootProject.projectDir}/local_servers/neoforge/${mcVersion}/mods")
            if (!localModsDir.exists()) {
                println "local_servers/neoforge/${mcVersion}/mods not found – skipped local deploy."
                return
            }

            localModsDir.listFiles()?.findAll { File f ->
                f.name.endsWith(".jar") &&
                        f.name.toLowerCase().contains(rootProject.archives_name.toString().toLowerCase())
            }?.each { it.delete() }

            copy {
                from nfJars
                into localModsDir
            }

            println "Deployed NeoForge ${mcVersion} jar to ${nfOut} and ${localModsDir}"
        }
    }

    tasks.register("runLocalNeoForge", Exec) {
        group = "run/neoforge"
        description = "Build, deploy and run local NeoForge server for MC ${mcVersion}"
        dependsOn "buildAndCopyNeoForgeJars"

        def serverDir = file("$rootProject.projectDir/local_servers/neoforge/${mcVersion}")
        workingDir serverDir

        // On Windows a .bat cannot be launched directly by Exec/ProcessBuilder and `cmd /c` will
        // not resolve a bare name from the working dir, so reference the script by absolute path.
        if (OperatingSystem.current().isWindows()) {
            commandLine "cmd", "/c", new File(serverDir, "run.bat").absolutePath
        } else {
            commandLine "bash", new File(serverDir, "run.sh").absolutePath
        }
        // run.bat / run.sh invoke a bare `java`; put this target's toolchain JDK first on PATH so
        // the server classes load on the right Java version.
        doFirst {
            def javaBin = serverJavaLauncher.get().executablePath.asFile.parentFile.absolutePath
            environment "PATH", javaBin + File.pathSeparator + (System.getenv("PATH") ?: "")
        }
    }
}
