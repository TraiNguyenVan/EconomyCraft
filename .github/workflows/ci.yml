name: CI

# One workflow, three triggers:
#   - PR / push to main  -> tests + full jar smoke build, jars uploaded as artifacts
#   - push of a v* tag   -> verify, build jars, GitHub-generated release notes + Release
#   - manual (Actions tab, dry_run or real)
# Tag-push and manual runs share the same steps; a real manual run creates the tag with the Release.
#
# Release contract:
#   - The tag must equal v<mod_version from gradle.properties>, or the run fails.
#   - GitHub generates release notes from merged PRs between this tag and the previous release.
#   - The tag and release target the exact commit that CI built; retries reuse that tag.
#   - A manual-run dry_run builds jars without creating a tag or Release.

on:
  pull_request:
    paths:
      - 'api/src/**'
      - 'common/src/**'
      - 'fabric/src/**'
      - 'neoforge/src/**'
      - 'api/build.gradle'
      - 'common/build.gradle'
      - 'fabric/build.gradle'
      - 'neoforge/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'neoforge/gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - 'wiki/**'
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - 'api/src/**'
      - 'common/src/**'
      - 'fabric/src/**'
      - 'neoforge/src/**'
      - 'api/build.gradle'
      - 'common/build.gradle'
      - 'fabric/build.gradle'
      - 'neoforge/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'neoforge/gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/ci.yml'
      - 'wiki/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - tests and jars only, no tag or Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Tests + jar build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Same gate the release job uses: releases are never built from an untested commit.
      - name: Common tests
        run: ./gradlew :common:test --no-daemon

      # PR checks only covered compile before; building the actual jars surfaces packaging
      # (remapping, shadow jar, resources) breaks on every PR instead of at release time.
      - name: Build both loader jars (MC 26.3)
        run: ./gradlew buildAndCopyFabricJars_26.3 buildAndCopyNeoForgeJars_26.3 --no-daemon

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            build/fabric/26.3/*.jar
            build/neoforge/26.3/*.jar
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      # One shared group: every release run edits and pushes main, so two concurrent
      # releases (a tag push and a manual run) must serialize, not race on different refs.
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # Tag-push: the tag already exists and must match gradle.properties.
      # Manual: run from main and let gh release create the tag at the exact tested commit.
      - name: Resolve version and tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          MOD_VERSION=$(grep -E '^mod_version' gradle.properties | sed -E 's/^mod_version\s*=\s*//' | tr -d '[:space:]')

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DRY="${{ inputs.dry_run }}"
            if [ "${{ github.ref_name }}" != "main" ] && [ "${DRY}" != "true" ]; then
              echo "::error::Manual release runs must be dispatched from 'main' (only dry runs may use another branch); you picked '${{ github.ref_name }}'."
              exit 1
            fi
            TAG="v${MOD_VERSION}"
            # The existing-tag check is release bookkeeping; dry runs promise build-only
            # and must never be blocked by it.
            if [ "${DRY}" != "true" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              if [ "$(git rev-list -n1 "refs/tags/${TAG}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error::Tag ${TAG} already exists but points at a different commit; a release can only be retried from the exact commit it tagged. Bump mod_version if this is a new release."
                exit 1
              fi
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
            if [ "${VER}" = "${TAG}" ]; then
              echo "::error::Refusing non-semver tag name: ${TAG}"
              exit 1
            fi
            if [ "${VER}" != "${MOD_VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match gradle.properties mod_version ${MOD_VERSION}."
              exit 1
            fi
            DRY="false"
          fi

          {
            echo "ver=${MOD_VERSION}"
            echo "tag=${TAG}"
            echo "dry=${DRY}"
          } >> "$GITHUB_OUTPUT"

      - name: Common tests
        run: ./gradlew :common:test --no-daemon

      - name: Build Fabric jar (MC 26.3)
        run: ./gradlew buildAndCopyFabricJars_26.3 --no-daemon

      - name: Build NeoForge jar (MC 26.3)
        run: ./gradlew buildAndCopyNeoForgeJars_26.3 --no-daemon

      - name: Collect jars and checksums
        run: |
          set -euo pipefail
          mkdir release
          cp build/fabric/26.3/*.jar build/neoforge/26.3/*.jar release/
          (cd release && for f in *.jar; do sha256sum -- "$f" > "$f.sha256"; done)
          ls -la release

      - name: Upload dry-run jars
        if: steps.resolve.outputs.dry == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            release/*.jar
            release/*.sha256
          if-no-files-found: error
          retention-days: 7
        # Dry run ends here; every step below is gated on dry != true.

      - name: Generate GitHub release notes
        if: steps.resolve.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > releasenotes.md

      # Idempotent: if a previous attempt already created the release, update its
      # generated notes and replace the assets from this exact build.
      - name: Create GitHub Release
        if: steps.resolve.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.resolve.outputs.ver }}
          TAG: ${{ steps.resolve.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          if gh release create "${TAG}" release/* \
            --title "EconomyCraft ${VER}" \
            --target "${TARGET}" \
            --notes-file releasenotes.md; then
            exit 0
          fi
          echo "Release ${TAG} already exists; treating it as a resume and updating notes and files."
          gh release edit "${TAG}" --title "EconomyCraft ${VER}" --notes-file releasenotes.md
          gh release upload "${TAG}" release/* --clobber
